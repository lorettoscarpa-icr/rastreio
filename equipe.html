<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entregadores ao vivo · Loretto Scarpa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#283d1a; --bg2:#1f3013; --surface:#374f24; --surface-2:#46672f; --surface-3:#60813e;
    --gold:#d4b45a; --gold-lt:#ebd48a; --teal:#7fae6b; --calm:#7fae6b; --ink:#1f3013;
    --text:#f8f3e6; --text-soft:rgba(248,243,230,.78); --text-mute:rgba(248,243,230,.5);
    --line:rgba(212,180,90,.18); --line-strong:rgba(212,180,90,.34);
    --ff-display:'Playfair Display',serif; --ff-eyebrow:'Barlow',sans-serif; --ff-data:'DM Mono',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ff-eyebrow);-webkit-font-smoothing:antialiased}

  .ent-live-ov{position:fixed;inset:0;z-index:340;background:var(--bg);display:flex;flex-direction:column;overscroll-behavior:contain}
  .ent-live-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:2}
  .ent-live-title{font-family:var(--ff-display);font-size:21px;color:var(--gold-lt);flex:1;font-weight:600}
  .ent-live-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + env(safe-area-inset-bottom)) 16px;max-width:640px;margin:0 auto;width:100%}
  .ent-live-map{height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--line-strong);background:var(--surface);margin-bottom:8px}
  .ent-live-map .leaflet-container{height:100%;width:100%;background:#1b2a12}
  .ent-live-mapnote{font-size:12px;color:var(--text-mute);margin:0 2px 14px;text-align:center}
  .ent-live-sec{font-family:var(--ff-eyebrow);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mute);margin:6px 2px 10px}

  .elv-back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--gold-lt);font-family:var(--ff-eyebrow);font-weight:600;font-size:13.5px;cursor:pointer;padding:2px 0;margin-bottom:10px}

  .elv-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .elv-card.foco{border-color:var(--line-strong)}
  .elv-head{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
  .elv-head:hover{background:var(--surface-2)}
  .elv-dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
  .elv-avatar{width:36px;height:36px;border-radius:50%;flex:none;background-size:cover;background-position:center;border:2px solid var(--bg)}
  .elv-id{flex:1;min-width:0}
  .elv-name{display:block;font-family:var(--ff-display);font-size:17px;color:var(--text);font-weight:600;line-height:1.15}
  .elv-when{display:block;font-size:11px;color:var(--text-mute);margin-top:3px}
  .elv-live{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;flex:none}
  .elv-live.on{color:#bfe6a8;background:rgba(127,174,107,.2)}
  .elv-live.off{color:var(--text-mute);background:rgba(255,255,255,.05)}
  .elv-chev{color:var(--text-mute);font-size:18px;margin-left:2px;flex:none}
  .elv-counts{display:flex;gap:8px;font-size:12px;color:var(--text-soft);padding:0 14px 12px;flex-wrap:wrap}
  .elv-pill{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
  .elv-pill b{color:var(--text)}
  .elv-pill.rota b{color:var(--teal)}
  .elv-pill.ok b{color:var(--calm)}
  .elv-body{border-top:1px solid var(--line);padding:12px 14px;background:var(--bg2)}
  .elv-caminho{font-size:13.5px;color:var(--gold-lt);background:rgba(212,180,90,.1);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px}
  .elv-grp{font-family:var(--ff-eyebrow);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mute);margin:8px 0 7px}
  .elv-grp:first-child{margin-top:0}
  .elv-row{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:7px}
  .elv-row.fail{opacity:.92}
  .elv-row .num{font-family:var(--ff-eyebrow);font-size:11px;font-weight:700;color:var(--ink);background:var(--gold);min-width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
  .elv-row .hr{font-family:var(--ff-data);font-size:11.5px;color:var(--gold-lt);background:rgba(212,180,90,.14);border:1px solid var(--line-strong);border-radius:7px;padding:1px 6px;flex:none;margin-top:1px;white-space:nowrap}
  .elv-row .hr.fail{color:#e6b0a8;background:rgba(210,90,72,.14)}
  .elv-row .info{flex:1;min-width:0}
  .elv-row .cli{font-size:14px;color:var(--text)}
  .elv-row.fail .cli{color:var(--text-soft)}
  .elv-row .sub{font-size:11.5px;color:var(--text-mute);margin-top:1px;display:block}
  .elv-row .tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;margin-top:4px;display:inline-block}
  .elv-row .tag.ok{color:#bfe6a8;background:rgba(127,174,107,.18)}
  .elv-row .tag.fail{color:#e6b0a8;background:rgba(210,90,72,.16)}
  .elv-empty{font-size:12.5px;color:var(--text-mute);padding:4px 2px 6px}
  .elv-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .elv-wa{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-decoration:none;color:#bfe6a8;background:rgba(127,174,107,.16);border:1px solid rgba(127,174,107,.34);border-radius:9px;padding:6px 11px}
  .elv-msg{font-size:13px;color:var(--text-mute);text-align:center;padding:22px 10px}

  .lsmoto-wrap{position:relative;width:40px;height:40px}
  .lsmoto-halo{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;opacity:.30;animation:lsmotoping 1.8s ease-out infinite}
  @keyframes lsmotoping{0%{transform:scale(.42);opacity:.8}100%{transform:scale(1.7);opacity:0}}
  .lsmoto-dot{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid rgba(255,255,255,.9);box-shadow:0 3px 11px rgba(0,0,0,.45)}
  .ls-num{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;background:var(--gold);color:#14210d;font-family:'Barlow',sans-serif;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .ls-done{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#7dd08f;color:#0c2c1a;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}

  @media(max-width:560px){ .ent-live-map{height:240px} }
</style>
</head>

</div>

function _entAvatar(ent){ var f=FOTOS_ENT[ent.id]; return f ? '<span class="elv-avatar" style="background-image:url('+f+');box-shadow:0 0 0 2px '+ent.cor+'"></span>' : '<span class="elv-dot" style="background:'+ent.cor+'"></span>'; }

/* ===== helpers ===== */
function $(id){ return document.getElementById(id); }
function esc(s){ return (''+(s==null?'':s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmtClock(ts){ return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtAgeCurto(ts){
  var s=Math.max(0,Math.round((Date.now()-ts)/1000));
  if(s<60) return 'agora';
  var m=Math.round(s/60);
  if(m<60) return 'há '+m+'min';
  var h=Math.round(m/60);
  if(h<24) return 'há '+h+'h';
  return 'há '+Math.round(h/24)+'d';
}
function hrTxt(e){ return e.horarioHora ? ('até '+e.horarioHora) : ''; }
function telEnt(id){ var e=ENT[id]; return e&&e.tel?e.tel:''; }
function _ehHoje(ts){ if(!ts) return false; var d=new Date(ts), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }
function _hojeKey(){ var n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
function _finalStamp(e){ return Math.max(e.entregueEm||0, e.desfechoEm||0); }
function _reabreStamp(e){ return Math.max(e.reabertoEm||0, e.reagendadaEm||0); }
function _finalizadaE(e){ var fs=_finalStamp(e); return fs>0 && _reabreStamp(e)<=fs; }
function coordFrom(url){
  if(!url) return null; var s; try{ s=decodeURIComponent(url); }catch(e){ s=url; }
  var pats=[/[?&]q=(-?\d{1,2}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/,/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,/[?&]ll=(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,/[?&]destination=(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/(-?\d{1,2}\.\d{4,}),\s*(-?\d{1,3}\.\d{4,})/];
  for(var i=0;i<pats.length;i++){ var m=s.match(pats[i]); if(m) return {lat:parseFloat(m[1]), lng:parseFloat(m[2])}; }
  return null;
}
function coordOf(e){ return e.coord||coordFrom(e.link); }

/* ===== estado vindo do Firebase ===== */
var liveEnt={};      // posições (coleção rastreio)
var _porEnt={};      // entregas de cada entregador (consulta where entregador==id)

function posicaoViva(id){
  var r=liveEnt[id];
  if(r && r.ativo && r.lat!=null && (Date.now()-(r.atualizadoEm||0) < 150000)) return {lat:r.lat, lng:r.lng};
  return null;
}
function posicaoUltima(id){       // última posição conhecida (mesmo sem sinal) — só de hoje
  var r=liveEnt[id];
  if(!(r && r.lat!=null && r.atualizadoEm)) return null;
  if(!_ehHoje(r.atualizadoEm)) return null;
  var age=Date.now()-(r.atualizadoEm||0);
  return {lat:r.lat, lng:r.lng, fresca: age<150000, min: Math.floor(age/60000), atualizadoEm:r.atualizadoEm};
}
function statusInfo(id){
  var r=liveEnt[id];
  if(!r || r.atualizadoEm==null) return {vivo:false, txt:'sem posição hoje'};
  if(posicaoViva(id)) return {vivo:true, txt:'atualizado '+fmtAgeCurto(r.atualizadoEm)};
  return {vivo:false, txt:'última '+fmtAgeCurto(r.atualizadoEm)};
}
function _entLiveDados(id){
  var minhas=_porEnt[id]||[];
  var rota=minhas.filter(function(e){ return e.status==='em_rota' && !_finalizadaE(e) && (!e.dataEntrega || e.dataEntrega === _hojeKey()); })
    .sort(function(a,b){ return ((a.ordemManual==null?9999:a.ordemManual)-(b.ordemManual==null?9999:b.ordemManual)) || ((a.roteadoEm||0)-(b.roteadoEm||0)); });
  // FINALIZADAS de HOJE = entregues + não concluídas, em ordem de horário
  var fin=minhas.filter(function(e){ return ['entregue','nao_entregue','cancelado'].indexOf(e.status)>=0 && _ehHoje(e.entregueEm||e.desfechoEm); })
    .map(function(e){ return {e:e, ok:e.status==='entregue', when:(e.entregueEm||e.desfechoEm||0)}; })
    .sort(function(a,b){ return a.when-b.when; });
  return {rota:rota, fin:fin};
}

/* ===== mapa ===== */
var mapLive=null, mapLiveLayer=null, _mapLiveInit=false;
var _focoId=null, _focoKey=null, _focoLine=null;

function _mapFail(){ var el=$('map-live'); if(el){ el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:18px;text-align:center;color:var(--text-mute);font-size:12.5px;line-height:1.5">Não consegui carregar o mapa agora.<br>A lista da equipe abaixo funciona normalmente.</div>'; } }
function ensureMapLive(){
  if(_mapLiveInit){ if(mapLive) setTimeout(function(){ mapLive.invalidateSize(); },50); return; }
  if(typeof L==='undefined'){ _mapFail(); _mapLiveInit=true; return; }
  mapLive=L.map('map-live',{zoomControl:true}).setView([-16.6869,-49.2648],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapLive);
  mapLiveLayer=L.layerGroup().addTo(mapLive);
  _mapLiveInit=true;
  setTimeout(function(){ mapLive.invalidateSize(); },60);
}
function _motoDiv(cor, fresca){
  var stale = fresca===false;
  var halo = stale ? '' : '<div class="lsmoto-halo" style="background:'+cor+'"></div>';
  var dot = 'background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), '+cor+');' + (stale ? 'opacity:.55;filter:grayscale(.4);border-style:dashed;' : '');
  return L.divIcon({className:'lsdi',iconSize:[40,40],iconAnchor:[20,20],html:'<div class="lsmoto-wrap">'+halo+'<div class="lsmoto-dot" style="'+dot+'">🏍️</div></div>'});
}
function _ageTxt(min){ if(min<1) return 'agora mesmo'; if(min<60) return 'há '+min+' min'; var h=Math.floor(min/60); return 'há '+h+'h'+(min%60?(' '+(min%60)+'min'):''); }
function _numDiv(n){ return L.divIcon({className:'lsdi',iconSize:[28,28],iconAnchor:[14,14],html:'<div class="ls-num">'+n+'</div>'}); }
function _doneDiv(){ return L.divIcon({className:'lsdi',iconSize:[24,24],iconAnchor:[12,12],html:'<div class="ls-done">✓</div>'}); }

/* rota real pela rua (OSRM público; cai na reta se falhar) */
function rotaRuas(wps){
  try{
    var url='https://router.project-osrm.org/route/v1/driving/'+wps.map(function(p){return p.lng+','+p.lat;}).join(';')+'?overview=full&geometries=geojson';
    return fetch(url).then(function(r){return r.json();}).then(function(j){
      if(j && j.routes && j.routes[0]) return j.routes[0].geometry.coordinates.map(function(c){return [c[1],c[0]];});
      return null;
    }).catch(function(){ return null; });
  }catch(_){ return Promise.resolve(null); }
}

function renderMapLive(){
  if(!mapLive || !mapLiveLayer) return;
  if(_focoId) return desenharFoco();
  return desenharTodos();
}
function desenharTodos(){
  mapLiveLayer.clearLayers();
  var bounds=[], n=0, nVivo=0;
  ENTREGADORES.forEach(function(ent){
    var p=posicaoUltima(ent.id); if(!p) return;
    n++; if(p.fresca) nVivo++;
    var d=_entLiveDados(ent.id);
    var pop='<b>'+esc(ent.nome)+'</b><br>🛵 '+d.rota.length+' em rota'+(p.fresca?'':'<br>⚪ última posição '+_ageTxt(p.min));
    L.marker([p.lat,p.lng],{icon:_motoDiv(ent.cor, p.fresca)}).addTo(mapLiveLayer).bindPopup(pop);
    bounds.push([p.lat,p.lng]);
  });
  if(bounds.length>1) mapLive.fitBounds(bounds,{padding:[42,42],maxZoom:14});
  else if(bounds.length===1) mapLive.setView(bounds[0],14);
  var note=$('ent-live-mapnote');
  if(note){
    if(!n){ note.textContent='Nenhuma posição registrada hoje.'; }
    else { var partes=[]; if(nVivo) partes.push('🟢 '+nVivo+' transmitindo ao vivo'); if(n-nVivo) partes.push('⚪ '+(n-nVivo)+' na última posição'); note.textContent=partes.join('  ·  '); }
  }
}
function desenharFoco(){
  mapLiveLayer.clearLayers();
  var ent=ENT[_focoId]; if(!ent) return;
  var d=_entLiveDados(_focoId);
  var pos=posicaoUltima(_focoId);
  var bounds=[];
  d.fin.forEach(function(f){ var c=f.ok?coordOf(f.e):null; if(c){ L.marker([c.lat,c.lng],{icon:_doneDiv()}).addTo(mapLiveLayer); bounds.push([c.lat,c.lng]); } });
  d.rota.forEach(function(e,i){ var c=coordOf(e); if(c){ L.marker([c.lat,c.lng],{icon:_numDiv(i+1)}).addTo(mapLiveLayer).bindPopup((i+1)+'. <b>'+esc(e.cliente)+'</b>'); bounds.push([c.lat,c.lng]); } });
  var wps=[]; if(pos) wps.push(pos); d.rota.forEach(function(e){ var c=coordOf(e); if(c) wps.push(c); });
  var stopsKey=d.rota.map(function(e){ var c=coordOf(e); return c?c.lat.toFixed(4)+','+c.lng.toFixed(4):''; }).join(';');
  if(_focoKey!==stopsKey){ _focoKey=stopsKey; _focoLine=null;
    if(wps.length>=2) rotaRuas(wps).then(function(line){ if(line && _focoId===ent.id && _focoKey===stopsKey){ _focoLine=line; if(mapLiveLayer) desenharFoco(); } });
  }
  if(wps.length>=2){
    var pts = _focoLine ? _focoLine : wps.map(function(p){ return [p.lat,p.lng]; });
    L.polyline(pts,{color:ent.cor, weight:4, opacity:.9, dashArray:_focoLine?null:'6,8'}).addTo(mapLiveLayer);
  }
  if(pos){ L.marker([pos.lat,pos.lng],{icon:_motoDiv(ent.cor, pos.fresca)}).addTo(mapLiveLayer).bindPopup('<b>'+esc(ent.nome)+'</b>'+(pos.fresca?'<br>🟢 ao vivo':'<br>⚪ última posição '+_ageTxt(pos.min))); bounds.push([pos.lat,pos.lng]); }
  if(bounds.length>1) mapLive.fitBounds(bounds,{padding:[46,46],maxZoom:15});
  else if(bounds.length===1) mapLive.setView(bounds[0],15);
  var st=statusInfo(_focoId), note=$('ent-live-mapnote');
  if(note) note.textContent = (st.vivo?'🟢 ':'⚪ ')+esc(ent.nome)+' · '+st.txt+' · '+(d.rota.length?(d.rota.length+' parada'+(d.rota.length>1?'s':'')+' restante'+(d.rota.length>1?'s':'')):'rota concluída');
}

/* ===== foco / voltar ===== */
function selecionarFrota(id){ _focoId=id; _focoKey=null; _focoLine=null; $('ent-live-title').textContent='🛵 '+ENT[id].nome; $('ent-live-sec').textContent='Rota em andamento'; renderEntLiveList(); renderMapLive(); var b=$('ent-live-body'); if(b) b.scrollTop=0; }
function voltarFrota(){ _focoId=null; _focoKey=null; _focoLine=null; $('ent-live-title').textContent='🛵 Entregadores Ao Vivo'; $('ent-live-sec').textContent='Toque em um entregador para ver a rota dele'; renderEntLiveList(); renderMapLive(); }

/* ===== lista ===== */
function _rowsRota(d){
  return d.rota.length
    ? d.rota.map(function(e,i){ return '<div class="elv-row"><span class="num">'+(i+1)+'</span><span class="info"><span class="cli">'+esc(e.cliente||'cliente')+'</span><span class="sub">'+esc([e.bairro,e.cidade].filter(Boolean).join(' - ')||'sem bairro')+((e.horarioTipo&&e.horarioHora)?' · ⏰ '+esc(hrTxt(e)):'')+'</span></span></div>'; }).join('')
    : '<div class="elv-empty">Nada em rota agora.</div>';
}
function _rowsFin(d){
  if(!d.fin.length) return '<div class="elv-empty">Nenhuma finalizada hoje ainda.</div>';
  return d.fin.map(function(f){
    var e=f.e, hr=f.when?fmtClock(f.when):'—';
    if(f.ok) return '<div class="elv-row"><span class="hr">🕒 '+hr+'</span><span class="info"><span class="cli">'+esc(e.cliente||'cliente')+'</span><span class="sub">'+esc([e.bairro,e.cidade].filter(Boolean).join(' - ')||'')+'</span><span class="tag ok">✓ entregue</span></span></div>';
    var motivo = e.status==='cancelado' ? 'não comprou' : 'não entregue';
    if(e.motivo) motivo += ' · '+e.motivo;
    return '<div class="elv-row fail"><span class="hr fail">🕒 '+hr+'</span><span class="info"><span class="cli">'+esc(e.cliente||'cliente')+'</span><span class="sub">'+esc([e.bairro,e.cidade].filter(Boolean).join(' - ')||'')+'</span><span class="tag fail">✕ finalizada · não deu certo — '+esc(motivo)+'</span></span></div>';
  }).join('');
}
function focoCardHTML(id){
  var ent=ENT[id], d=_entLiveDados(id), st=statusInfo(id);
  var prox=d.rota[0];
  var caminho = prox ? ('🛵 A caminho de <b>'+esc((prox.cliente||'cliente').split(' ')[0])+'</b>'+(prox.bairro?' · '+esc(prox.bairro):'')) : '✓ Rota concluída por hoje';
  var tel=telEnt(id);
  return '<button class="elv-back" onclick="voltarFrota()">‹ Ver todos</button>'
    +'<div class="elv-card foco">'
      +'<div class="elv-head" style="cursor:default">'
        +_entAvatar(ent)
        +'<span class="elv-id"><span class="elv-name">'+esc(ent.nome)+'</span><span class="elv-when" data-when="'+ent.id+'">'+st.txt+'</span></span>'
        +'<span class="elv-live '+(st.vivo?'on':'off')+'">'+(st.vivo?'🟢 ao vivo':'⚪ sem sinal')+'</span>'
      +'</div>'
      +'<div class="elv-counts">'
        +'<span class="elv-pill rota">🛵 em rota: <b>'+d.rota.length+'</b></span>'
        +'<span class="elv-pill ok">✓ finalizadas hoje: <b>'+d.fin.length+'</b></span>'
      +'</div>'
      +'<div class="elv-body">'
        +'<div class="elv-caminho">'+caminho+'</div>'
        +'<div class="elv-grp">🛵 Em rota agora — paradas que faltam ('+d.rota.length+')</div>'+_rowsRota(d)
        +'<div class="elv-grp">✓ Finalizadas hoje — na ordem que ele fechou ('+d.fin.length+')</div>'+_rowsFin(d)
        +(tel?'<div class="elv-acts"><a class="elv-wa" href="https://wa.me/'+tel+'" target="_blank" rel="noopener">'+WA_ICON+' Falar com '+esc(ent.nome.split(' ')[0])+'</a></div>':'')
      +'</div>'
    +'</div>';
}
function renderEntLiveList(){
  var box=$('ent-live-list'); if(!box) return;
  if(_focoId){ box.innerHTML=focoCardHTML(_focoId); return; }
  var dados=ENTREGADORES.map(function(ent){ return {ent:ent, vivo:!!posicaoViva(ent.id), st:statusInfo(ent.id), d:_entLiveDados(ent.id)}; });
  dados.sort(function(a,b){ return (b.vivo-a.vivo) || (b.d.rota.length-a.d.rota.length) || (b.d.fin.length-a.d.fin.length); });
  var mostra=dados.filter(function(x){ return x.d.rota.length>0 || x.d.fin.length>0; });
  if(!mostra.length){ box.innerHTML='<div class="elv-msg">Nenhum entregador com entregas hoje no momento.</div>'; return; }
  box.innerHTML = mostra.map(function(o){
    var ent=o.ent, d=o.d, st=o.st;
    return '<div class="elv-card">'
      +'<div class="elv-head" onclick="selecionarFrota(\''+ent.id+'\')">'
        +_entAvatar(ent)
        +'<span class="elv-id"><span class="elv-name">'+esc(ent.nome)+'</span><span class="elv-when" data-when="'+ent.id+'">'+st.txt+'</span></span>'
        +'<span class="elv-live '+(st.vivo?'on':'off')+'">'+(st.vivo?'🟢 ao vivo':'⚪ sem sinal')+'</span>'
        +'<span class="elv-chev">›</span>'
      +'</div>'
      +'<div class="elv-counts">'
        +'<span class="elv-pill rota">🛵 em rota: <b>'+d.rota.length+'</b></span>'
        +'<span class="elv-pill ok">✓ finalizadas hoje: <b>'+d.fin.length+'</b></span>'
      +'</div>'
    +'</div>';
  }).join('');
}

/* ===== conexão (abre sem login, igual ao antigo) ===== */
var _unsubRast=null, _unsubEnt={}, _started=false;
function listMsg(t){ var b=$('ent-live-list'); if(b) b.innerHTML='<div class="elv-msg">'+esc(t)+'</div>'; }
function iniciar(){
  if(_started) return; _started=true;
  if(!FIREBASE_ON || !fdb){ listMsg('Sem conexão com o servidor.'); return; }
  var sub=function(){
    // posições ao vivo (coleção rastreio) — leitura leve, como o antigo
    _unsubRast=fdb.collection('rastreio').onSnapshot(function(snap){
      var m={}; snap.forEach(function(d){ m[d.id]=d.data()||{}; }); liveEnt=m;
      renderEntLiveList(); renderMapLive();
    }, function(e){ console.warn('rastreio', e); });
    // entregas de cada entregador — uma consulta pequena por pessoa (sem "ler tudo")
    ENTREGADORES.forEach(function(ent){
      _unsubEnt[ent.id]=fdb.collection('entregas').where('entregador','==',ent.id).onSnapshot(function(snap){
        var arr=[]; snap.forEach(function(d){ var x=d.data()||{}; x.id=d.id; arr.push(x); }); _porEnt[ent.id]=arr;
        renderEntLiveList(); renderMapLive();
      }, function(e){ console.warn('entregas '+ent.id, e); });
    });
  };
  if(typeof firebase!=='undefined'){ firebase.auth().signInAnonymously().then(sub).catch(sub); } else sub();
  // atualiza só o "há X" do status a cada 20s
  setInterval(function(){
    document.querySelectorAll('[data-when]').forEach(function(el){ el.textContent=statusInfo(el.getAttribute('data-when')).txt; });
  }, 20000);
}
window.addEventListener('load', function(){
  try{ ensureMapLive(); }catch(e){ _mapFail(); }
  iniciar();
});
</script>
